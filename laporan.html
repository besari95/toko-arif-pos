<!-- Tab Pengeluaran -->
<div class="mt-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">
        <i class="fas fa-money-bill-wave text-violet-600 mr-2"></i>Catatan Pengeluaran
    </h3>

    <!-- Form Tambah Pengeluaran -->
    <div class="bg-gray-50 rounded-lg p-4 mb-4">
        <form id="formPengeluaran" class="grid grid-cols-1 md:grid-cols-4 gap-3">
            <input type="text" id="deskripsiPengeluaran" placeholder="Deskripsi" required class="form-input">
            <input type="number" id="nominalPengeluaran" placeholder="Nominal" required class="form-input">
            <select id="kategoriPengeluaran" class="form-input">
                <option value="Operasional">Operasional</option>
                <option value="Stok">Stok Barang</option>
                <option value="Listrik">Listrik</option>
                <option value="Sewa">Sewa</option>
                <option value="Lainnya">Lainnya</option>
            </select>
            <button type="submit" class="bg-violet-600 text-white px-4 py-2 rounded-lg hover:bg-violet-700">
                <i class="fas fa-plus mr-2"></i>Tambah
            </button>
        </form>
    </div>

    <!-- Daftar Pengeluaran -->
    <div id="daftarPengeluaran" class="space-y-2">
        <!-- Data akan di-load disini -->
    </div>
</div>

<!-- Laporan Laba Rugi -->
<div class="mt-8 bg-gradient-to-r from-violet-50 to-purple-50 rounded-xl p-6">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">
        <i class="fas fa-chart-pie text-violet-600 mr-2"></i>Laporan Laba Rugi
    </h3>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white rounded-lg p-4 text-center">
            <p class="text-sm text-gray-500">Total Omzet</p>
            <p id="totalOmzet" class="text-2xl font-bold text-green-600">Rp 0</p>
        </div>
        <div class="bg-white rounded-lg p-4 text-center">
            <p class="text-sm text-gray-500">Total Modal</p>
            <p id="totalModal" class="text-2xl font-bold text-orange-600">Rp 0</p>
        </div>
        <div class="bg-white rounded-lg p-4 text-center">
            <p class="text-sm text-gray-500">Total Pengeluaran</p>
            <p id="totalPengeluaran" class="text-2xl font-bold text-red-600">Rp 0</p>
        </div>
        <div class="bg-white rounded-lg p-4 text-center border-2 border-violet-200">
            <p class="text-sm text-gray-500">Laba Bersih</p>
            <p id="labaBersih" class="text-2xl font-bold text-violet-600">Rp 0</p>
        </div>
    </div>
</div>
